<!--
  Minimal Wazuh manager config for the LLM Adversary Lab (single node, no agents).
  Mounted to /wazuh-config-mount/etc/ossec.conf; the wazuh-manager image copies it over
  /var/ossec/etc/ossec.conf on start. Deliberately lean: no syscheck/rootcheck/vuln-detector.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <!-- Agent transport kept for later endpoint monitoring (auditd); not published to the host. -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <!-- Suricata eve.json from the shared suricata-logs volume (mounted read-only). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules</rule_dir>
    <list>etc/lists/audit-keys</list>
  </ruleset>
</ossec_config>
