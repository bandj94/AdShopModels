# Heavier profile: Juice Shop + full blue team, lower caps for a careful, well-observed run.
# Use when you want maximum detection coverage; needs more RAM headroom.
deployment:
  mode: docker
  lab_cidr: 10.13.37.0/24
  egress: false

attacker:
  kind: container
  container_name: lab-attacker
  ip: 10.13.37.10
  llm:
    endpoint: http://localhost:11434/v1
    model: qwen3:8b
    temperature: 0.2            # steadier for a watched run
    max_tokens: 2048

target:
  kind: juice-shop
  provider: docker
  container_name: lab-target
  ip: 10.13.37.20

blueteam:
  siem: wazuh
  nids: suricata
  endpoint_monitoring: auditd

run:
  goal: "Find and read the flag on the target"
  max_steps: 25
  step_timeout_s: 90
  max_wall_clock_s: 2400
  stop_on_goal: true

safety:
  default_deny: true
  allow: [nmap, curl, wget, sqlmap, nikto, whatweb, gobuster, ffuf, hydra, nc, ncat,
          cat, ls, grep, head, tail, echo, whoami, id, uname, ps, netstat, ss, dig, host]
  deny: ["shutdown", "reboot", "rm -rf /", "mkfs", ":(){", "dd if=", "> /dev/sd",
         "iptables -F", "/etc/shadow >", "chmod -R 777 /"]
